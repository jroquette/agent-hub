[pytest]
# pytest 9: strict_config, strict_markers, strict_parametrization_ids and xfail_strict.
strict = true
addopts = --import-mode=importlib --allow-unix-socket
testpaths = packages tests
pythonpath = .
markers =
    unit: fast, in-memory, no I/O
    contract: port contract run against fake and real adapter
    integration: real SQLite temp file
    e2e: subprocess, whole binary
    serial: asserts a wall-clock budget, so it runs alone after the parallel tests (make test-integration, make test-e2e)
    docker: builds the agent-hub image and runs its Compose service; needs a Docker daemon (skipped without one, fails under CI); run by make test-docker, never by make check
    live: calls a real external service; skipped unless AGENT_HUB_LIVE=1 and, for the Linear API, LINEAR_API_KEY, AGENT_HUB_LIVE_ISSUE and AGENT_HUB_LIVE_LABEL are set (live("mcp"): the same without LINEAR_API_KEY, plus AGENT_HUB_LIVE_HUB; live("claude"): a real claude -p session, only the switch)
python_files = test_*.py
