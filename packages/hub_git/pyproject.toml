[project]
name = "agent-hub-hub-git"
version = "0.1.0"
description = "Hub git adapter of agent-hub: opens hub pull requests for learning decisions with git and gh."
requires-python = ">=3.14"
dependencies = ["agent-hub-core"]

[tool.uv.sources]
agent-hub-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent_hub is an implicit namespace package shared by every distribution.
packages = ["src/agent_hub"]
