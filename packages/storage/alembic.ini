# Alembic config of the storage package (ADR 0003). Run from the repo root:
#   uv run --locked --all-packages alembic -c packages/storage/alembic.ini -x db_url=sqlite:///<file> upgrade head
# The database URL always comes from -x db_url=... or from the caller (tests use
# Config.set_main_option); the placeholder below is an in-memory database, so nothing here
# ever touches the real hub database.

[alembic]
script_location = %(here)s/alembic
path_separator = os
sqlalchemy.url = sqlite:///:memory:

[post_write_hooks]
# New revisions come out formatted like the rest of the repo.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
