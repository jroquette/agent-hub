[project]
name = "agent-hub-storage"
version = "0.1.0"
description = "SQLAlchemy Core and Alembic storage adapter of agent-hub."
requires-python = ">=3.14"
dependencies = ["agent-hub-core", "sqlalchemy>=2", "alembic"]

[tool.uv.sources]
agent-hub-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent_hub is an implicit namespace package shared by every distribution.
packages = ["src/agent_hub"]
