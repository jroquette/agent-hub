[project]
name = "agent-hub"
version = "0.1.0"
description = "Installs every agent-hub package and the hub command."
requires-python = ">=3.14"
dependencies = ["agent-hub-core", "agent-hub-storage", "agent-hub-collector", "agent-hub-cli"]

[tool.uv.sources]
agent-hub-core = { workspace = true }
agent-hub-storage = { workspace = true }
agent-hub-collector = { workspace = true }
agent-hub-cli = { workspace = true }

[project.scripts]
hub = "agent_hub.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling refuses a wheel with no files; this placeholder module is outside the agent_hub
# namespace so type checking, import contracts and coverage never see it (ADR 0001).
packages = ["src/agent_hub_meta"]
