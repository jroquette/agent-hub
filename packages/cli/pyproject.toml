[project]
name = "agent-hub-cli"
version = "0.34.0"
description = "The hub command line interface of agent-hub."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["agent-hub-core", "agent-hub-storage", "agent-hub-collector", "agent-hub-generator",
                "agent-hub-hub-git", "agent-hub-tracker-linear", "agent-hub-api", "agent-hub-mcp-server",
                # The cli imports typer's private click (vendored_click.py): only the tested range.
                "pydantic>=2", "typer>=0.27.2,<0.29"]

[tool.uv.sources]
agent-hub-core = { workspace = true }
agent-hub-storage = { workspace = true }
agent-hub-collector = { workspace = true }
agent-hub-generator = { workspace = true }
agent-hub-hub-git = { workspace = true }
agent-hub-tracker-linear = { workspace = true }
agent-hub-api = { workspace = true }
agent-hub-mcp-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent_hub is an implicit namespace package shared by every distribution.
packages = ["src/agent_hub"]
