# hub run's stages as a workflow (ADR 0032): the worktree, one implementing session in it, its
# verdict read as hub run reads it, the commits, the repo's gate, the PR, then the delivery
# (ADR 0030). No node retries, as hub run never does. A failed node fails the run and skips the
# report (no outcome: the delivery is failed); no_changes and blocked end it done. No node writes
# the tracker: hub workflow run does, from run.end's outcome. start: verify (hub run --from
# verify) skips the session and its verdict: the gate, PR and report run on the commits made.
version: 1
name: issue-to-pr
description: One tracker issue to a PR, as hub run takes it.
revision: 2
inputs:
  issue:
    required: true
    description: The tracker issue, <team>-<n>.
  repo:
    required: true
    description: The repo to change, its dir in hub.json.
  issue_text:
    required: true
    description: The issue as a fenced block of untrusted text, read from the tracker by the parent.
  start:
    default: implement
    description: Where the run starts, implement or verify (the gate on the commits already made).
returns: report
outcome_field: delivery
nodes:
  - id: worktree
    type: shell
    description: Make (or keep) the issue's worktree from a fresh fetch; print the repo's target.
    command: [hub, step, worktree, --issue, $INPUTS.issue, --repo, $INPUTS.repo]
    retry: {max_attempts: 0}
    timeout: 2h
    output_format:
      type: object
      properties:
        path: {type: string}
        branch: {type: string}
        base: {type: string}
        hub: {type: string}
        hub_name: {type: string}
        check: {type: string}
        prompt:
          type: object
          properties:
            guard: {type: string}
            gate_step: {type: string}
            commit_shape: {type: string}
          required: [guard, gate_step, commit_shape]
        target:
          type: object
          properties:
            path: {type: string}
            branch: {type: string}
            base: {type: string}
            default_branch: {type: string}
            github: {type: string}
            gate: {type: string}
            conventions:
              type: object
              properties:
                branch: {type: string}
                commit_title: {type: string}
                pr_title: {type: string}
                titles_configured: {type: boolean}
                pr_title_explicit: {type: boolean}
              required: [branch, commit_title, pr_title, titles_configured, pr_title_explicit]
          required: [path, branch, base, default_branch, github, gate, conventions]
      required: [path, branch, base, hub, hub_name, check, prompt, target]

  - id: implement
    type: agent
    description: The implementing session, one claude -p in the worktree, as hub run runs it.
    depends_on: [worktree]
    when: "$INPUTS.start != 'verify'"
    prompt_file: implement.md
    cwd: $worktree.output.path
    retry: {max_attempts: 0}

  - id: verdict
    type: shell
    description: The session's reply read as hub run reads it - done, or blocked with a question.
    depends_on: [implement]
    command: [hub, step, verdict, --, $implement.output]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        status: {type: string, enum: [done, blocked]}
        summary: {type: string}
        question: {type: string}
      required: [status, summary, question]

  - id: commits
    type: shell
    description: The commits on the branch, and whether a tracked change sits beside them.
    depends_on: [worktree, implement, verdict]
    trigger_rule: none_failed_min_one_success
    when: "$verdict.output.status != 'blocked'"
    command: [hub, step, commits, --target, $worktree.output.target]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        count: {type: integer, minimum: 0}
        subjects: {type: array, items: {type: string}}
        summary: {type: string}
        dirty: {type: boolean}
      required: [count, subjects, summary, dirty]

  - id: verify
    type: shell
    description: >-
      The repo's gate (its check) on the commits, without the GitHub tokens; its stdout then its
      stderr go to stderr, its last line breaks kept, so a failure's detail reads as hub run's.
    depends_on: [commits]
    when: "$commits.output.count > 0 && $commits.output.dirty == false"
    cwd: $worktree.output.path
    command:
      - bash
      - -c
      - '{ e=$(eval "$1" 2>&1 1>&3 3>&-; c=$?; echo .; exit $c); c=$?; } 3>&2; printf %s "${e%.}" >&2; exit $c'
      - bash
      - $worktree.output.check
    # No timeout of its own: the default, hub run's gate timeout (30 minutes).
    retry: {max_attempts: 0}

  - id: pr
    type: shell
    description: Push the branch and open its PR, or find the one open.
    depends_on: [verify]
    command:
      - hub
      - step
      - pr
      - --issue
      - $INPUTS.issue
      - --target
      - $worktree.output.target
      - --summary
      - $verdict.output.summary
    retry: {max_attempts: 0}
    timeout: 30m
    output_format:
      type: object
      properties:
        url: {type: string}
        found: {type: boolean}
        summary: {type: string}
        title_unmatched: {type: [string, "null"]}
      required: [url, found, summary, title_unmatched]

  - id: report
    type: shell
    description: The run's delivery, from what the steps printed (no tracker write).
    depends_on: [implement, verdict, commits, verify, pr]
    trigger_rule: none_failed_min_one_success
    command:
      - hub
      - step
      - report
      - --status
      - $verdict.output.status
      - --question
      - $verdict.output.question
      - --commits
      - $commits.output.count
      - --dirty
      - $commits.output.dirty
      - --pr
      - $pr.output.url
      - --summary
      - $pr.output.summary
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        delivery: {type: string, enum: [delivered, no_changes, blocked, failed]}
        stage: {type: string}
        reason: {type: string}
        question: {type: string}
        pr: {type: string}
        summary: {type: string}
      required: [delivery, stage, reason, question, pr, summary]
