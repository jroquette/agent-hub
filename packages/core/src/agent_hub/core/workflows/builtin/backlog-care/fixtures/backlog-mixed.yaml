    - {output: {decisions: [{id: DEM-3, decision: apply}, {id: DEM-4, decision: apply}], applied: 2}}
  report:
    output:
      outcome: apply
      summary: "Backlog care.\nHygiene of 7 issues read: 1 orphan, 1 stale, 1 duplicate group, 1 cycle."
      apply:
        - {id: DEM-3, action: draft, label: ready, superseded_by: "", draft: {size: fix}, note: "", approver: Jo}
        - {id: DEM-4, action: supersede, label: close, superseded_by: DEM-3, draft: {size: fix}, note: "", approver: Jo}
      skipped: []
expect: {status: done, outcome: apply}
reached: [config, read, hygiene, pick, draft, plan, decide, decide__next, decide__gate, decide__record, report]
