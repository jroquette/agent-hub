# AC-1: a mixed backlog (one orphan, one stale issue, one duplicate pair, one cycle): hygiene
# reports all four with evidence, the duplicate pair is drafted (DEM-4 closed as a duplicate of
# DEM-3), and each draft gets its own gate; both are applied after the run.
workflow: backlog-care
inputs: {issues_file: /tmp/backlog.json}
stubs:
  config:
    output: {default_branch: main, branch_prefix: jdoe/, author_name: null, author_email: null, ready_label: agent-ready, teams: [DEM], hub: {github: acme/demo-hub, default_branch: main, target: {github: acme/demo-hub, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}, repos: [{dir: demo-api, github: acme/demo-api, default_branch: main, check_fast: make check-fast, check: make check, target: {github: acme/demo-api, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}]}
  read:
    output:
      ready_label: agent-ready
      repos: [api]
      read: 7
      open: 7
      unread: 0
      unread_line: No open issue was left unread (7 of 7 read)
      descriptions_dropped: 0
      skipped: []
      issues:
        - {id: DEM-1, title: Add the export button, url: "", state: {name: In Progress, type: started}, created_at: "1999-09-01T10:00:00Z", updated_at: "1999-10-20T10:00:00Z", labels: [agent-ready], blocked_by: [], blocks: [], links: [], branch_name: "", description: The export button.}
        - {id: DEM-2, title: Fix the login timeout, url: "", state: {name: Todo, type: unstarted}, created_at: "1999-09-02T10:00:00Z", updated_at: "1999-09-01T10:00:00Z", labels: [needs-human], blocked_by: [], blocks: [], links: [], branch_name: "", description: Login times out.}
        - {id: DEM-3, title: "feat(api): Add CSV export", url: "", state: {name: Todo, type: unstarted}, created_at: "1999-09-03T10:00:00Z", updated_at: "1999-10-20T10:00:00Z", labels: [], blocked_by: [], blocks: [], links: [], branch_name: "", description: Export reports as CSV.}
        - {id: DEM-4, title: "Add  csv export!", url: "", state: {name: Backlog, type: backlog}, created_at: "1999-09-04T10:00:00Z", updated_at: "1999-10-20T10:00:00Z", labels: [], blocked_by: [], blocks: [], links: [], branch_name: "", description: CSV export please.}
        - {id: DEM-5, title: Split the importer, url: "", state: {name: Todo, type: unstarted}, created_at: "1999-09-05T10:00:00Z", updated_at: "1999-10-20T10:00:00Z", labels: [agent-ready], blocked_by: [DEM-6], blocks: [], links: [], branch_name: "", description: Split it.}
        - {id: DEM-6, title: Retry the importer, url: "", state: {name: Todo, type: unstarted}, created_at: "1999-09-06T10:00:00Z", updated_at: "1999-10-20T10:00:00Z", labels: [agent-ready], blocked_by: [DEM-5], blocks: [], links: [], branch_name: "", description: Retry it.}
