    - {output: {index: 1, last: true, item: {index: 1, id: DEM-4, action: supersede, label: close, superseded_by: DEM-3, draft: {size: fix}}, message: "DEM-4: close as a duplicate of DEM-3."}}
  decide__gate: [{decision: apply, text: "", approver: Jo}, {decision: apply, text: "", approver: Jo}]
  decide__record:
