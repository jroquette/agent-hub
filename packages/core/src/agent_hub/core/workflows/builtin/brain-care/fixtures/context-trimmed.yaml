# The owner keeps the first cut only: the run trims it in the hub worktree, one commit, one PR.
workflow: context
stubs:
  branch_config:
    output: {default_branch: main, branch_prefix: jdoe/, author_name: Jane Doe, author_email: jane@example.com, ready_label: agent-ready, teams: [DEM], hub: {github: acme/demo-hub, default_branch: main, target: {github: acme/demo-hub, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}, repos: [{dir: demo-api, github: acme/demo-api, default_branch: main, check_fast: make check-fast, check: make check, target: {github: acme/demo-api, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}], branch_name: brain-care-context-0a1b2c3d, branch: jdoe/brain-care-context-0a1b2c3d}
  inventory:
    output:
      total_tokens: 4800
      files:
        - {path: CLAUDE.md, kind: memory, lines: 2, chars: 30, tokens: 8, managed: true}
        - {path: docs/rules.md, kind: import, lines: 240, chars: 9600, tokens: 2400, managed: false}
        - {path: .claude/skills/big/SKILL.md, kind: skill, lines: 1, chars: 1100, tokens: 275, managed: false}
      over:
        - {path: docs/rules.md, rule: memory file over 200 lines, value: 240, limit: 200}
        - {path: .claude/skills/big/SKILL.md, rule: "skill description over 1,024 characters", value: 1100, limit: 1024}
      unreadable: []
      summary: "Always-loaded context: about 4800 tokens (an estimate: characters / 4).\nOver the limits:\n- docs/rules.md: memory file over 200 lines (240; limit 200)\n- .claude/skills/big/SKILL.md: skill description over 1,024 characters (1100; limit 1024)"
  report:
    output:
      summary: "Two files are over the limits. Cut docs/rules.md to its always-needed rules (about 1200 tokens); shorten the big skill description (about 50 tokens)."
      cuts:
        - {path: docs/rules.md, what: Move the release steps into the release skill., saved_tokens: 1200, managed: false}
        - {path: .claude/skills/big/SKILL.md, what: Shorten the description to its trigger words., saved_tokens: 50, managed: false}
  approve: {decision: trim, text: Only the rules file., approver: Dana Owner}
  branch:
    output:
      path: /ws/hub/.claude/worktrees/brain-care-context-0a1b2c3d
      branch: jdoe/brain-care-context-0a1b2c3d
      base: 0a1b2c3d4e5f
      target: {path: /ws/hub/.claude/worktrees/brain-care-context-0a1b2c3d, branch: jdoe/brain-care-context-0a1b2c3d, base: 0a1b2c3d4e5f}
  trim:
    output: {summary: Moved the release steps out of docs/rules.md (about 1200 tokens)., skipped: [.claude/skills/big/SKILL.md]}
  commits:
    output: {count: 1, subjects: ["docs(brain): trim always-loaded context"], summary: Moves the release steps., dirty: false}
  pr:
    output: {url: "https://github.com/acme/demo-hub/pull/9", found: false, summary: Moved the release steps., title_unmatched: null}
  managed:
    output: {changed: [docs/rules.md], managed: []}
  outcome:
    output: {outcome: pr_opened, reason: "opened https://github.com/acme/demo-hub/pull/9; after the merge, run: git worktree remove /ws/hub/.claude/worktrees/brain-care-context-0a1b2c3d && git branch -D jdoe/brain-care-context-0a1b2c3d"}
expect: {status: done, outcome: pr_opened}
reached: [branch_config, inventory, report, approve, branch, trim, managed, commits, pr, outcome]
