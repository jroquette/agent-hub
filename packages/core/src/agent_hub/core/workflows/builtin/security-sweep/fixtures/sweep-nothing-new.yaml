# A second run on the same scan: every finding is already seen, so triage is skipped, the note
# says nothing is new, and the run ends clean.
workflow: security-sweep
stubs:
  config:
    output: {default_branch: main, branch_prefix: jdoe/, author_name: null, author_email: null, ready_label: agent-ready, teams: [DEM], hub: {github: acme/demo-hub, default_branch: main, target: {github: acme/demo-hub, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}, repos: [{dir: demo-api, github: acme/demo-api, default_branch: main, check_fast: make check-fast, check: make check, target: {github: acme/demo-api, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}]}
  scan:
    output:
      repos:
        - repo: demo-api
          ref: origin/trunk
          head: 0a1b2c3d4e5f60718293a4b5c6d7e8f901234567
          date: "YYYY-MM-DDT10:00:00+00:00"
          status: scanned
          note: ""
          scanners:
            - {name: semgrep, status: ran, note: "", count: 1}
      findings:
        - {repo: demo-api, scanner: semgrep, rule: python.flask.security.injection.tainted-sql-string, path: api/db.py, line: 40, severity: high, cwe: CWE-89, secret: false, package: "", version: "", advisory: "", fixed: "", title: ""}
      more: 0
      trimmed: false
  new:
    output:
      findings: []
      listed: 0
      counts: {new: 0, seen: 1, more: 0}
      ran: [{repo: demo-api, scanner: semgrep}]
      current: [demo-api/semgrep/1123456789abcdef]
      store_problem: ""
  report: {output: {path: brain/_inbox/security-YYYY-MM-DD.md, kept: 0, secrets: 0, missing: [], triaged: [], status: clean}}
  mark: {output: {status: clean, marked: 0, store_size: 1}}
expect: {status: done, outcome: clean}
reached: [config, scan, new, report, mark]
