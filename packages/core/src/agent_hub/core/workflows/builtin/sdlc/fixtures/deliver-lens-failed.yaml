# The quality lens fails inside the round (its reply is not a review, or it changed the checkout):
# the round, and so the run, fails; no PR, no outcome.
workflow: deliver
inputs: {issue: DEM-1, repo: demo-api, issue_text: "```text\nid: DEM-1\n```"}
stubs:
  worktree:
    output:
      path: /ws/demo-api/.claude/worktrees/dem-1
      branch: jdoe/dem-1
      base: origin/trunk
      hub: /ws/hub
      hub_name: hub
      check: make check
      prompt: {guard: has, gate_step: Run the fast gate., commit_shape: Conventional Commits}
      target: {path: /ws/demo-api/.claude/worktrees/dem-1, branch: jdoe/dem-1, base: origin/trunk}
  rounds__implement: {text: Adds the change.}
  rounds__verdict: {output: {status: done, summary: Changes the code., question: ""}}
  rounds__check: {output: {passed: true, exit_code: 0, round: 1, tail: "ok\n"}}
  rounds__spec: {output: {schema: agent-hub/review/1, reviewer: spec, ticket: DEM-1, task: DEM-1, round: 1, commit: 0a1b2c3d, verdict: PASS, findings: []}}
  rounds__quality: {fail: config}
  rounds__notes: {output: {check: {passed: true, exit_code: 0, tail: "ok\n"}, findings: [], omitted: 0}}
expect: {status: failed}
failed: [rounds__quality, rounds]
reached: [worktree, rounds, rounds__implement, rounds__verdict, rounds__check, rounds__spec, rounds__quality, rounds__notes]
