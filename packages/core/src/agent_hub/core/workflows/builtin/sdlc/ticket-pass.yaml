# One pass of the ticket flow (two-level-flows S2, A2, A22), included up to three times by
# implement. First the ticket's preflight, included from preflight-check (S3): a fresh, read-only
# preflight against the plan and main's commit ticket-brief read, its run appended to
# preflight.json, and on `plan` drift a change request, the owner's gate (approve, or decline with
# a note), the decision, the amendment or the note, and a re-preflight. An approval the plan moved
# past is not amended (A23): the re-check reads the current plan, told so, and its run records it
# (no discovery loop is spent). A check still `blocked` on plan drift after a decision, or on a
# declined change given as input, ends the pass blocked (pass_outcome.py); the next /implement
# opens a new request. Only a preflight that passed makes the
# worktree and branch (hub step worktree, at the commit the preflight checked), then the ticket plan (tickets/<ticket>/plan.md) and
# deliver's review rounds (at most three, until PASS, the session blocked or its discovery, which
# hub step verdict reads; three without fail the group, max_iterations). The writers create or
# append in the hub and never commit; implement's report names the files (D-1).
version: 1
name: ticket-pass
description: One ticket pass - preflight, a plan change gate on plan drift, the worktree, the ticket plan and the review rounds.
revision: 2
inputs:
  feature:
    required: true
    description: The feature's folder under brain/features/.
  ticket:
    required: true
    description: The ticket's tracker issue, <team>-<n>.
  repo:
    required: true
    description: The repo to change, its dir in hub.json.
  issue_text:
    required: true
    description: The ticket as text, the task to do (untrusted).
  brief:
    required: true
    description: The context brief, its path in the hub.
  hub:
    required: true
    description: The hub's main checkout.
  main:
    required: true
    description: Main's commit the preflight reads and its run records (ticket-brief's).
  input:
    default: none
    description: What the pass is given - none, discovery or declined_change; a when reads it, so give a reference.
  input_text:
    default: ""
    description: The discovery, or the declined change's note.
  declined_request:
    default: ""
    description: The declined request a declined_change input comes from (pending-decision's).
returns: outcome
nodes:
  - id: check
    type: include
    description: The preflight, with the plan change gate on plan drift (preflight-check).
    include: preflight-check
    with:
      feature: $INPUTS.feature
      ticket: $INPUTS.ticket
      repo: $INPUTS.repo
      brief: $INPUTS.brief
      hub: $INPUTS.hub
      main: $INPUTS.main
      input: $INPUTS.input
      input_text: $INPUTS.input_text
      declined_request: $INPUTS.declined_request

  - id: worktree
    type: shell
    description: Once a preflight passed (local drift included), make (or keep) the ticket's worktree from a fresh fetch.
    depends_on: [check]
    when: "$check.output.status == 'passed'"
    command: [hub, step, worktree, --issue, $INPUTS.ticket, --repo, $INPUTS.repo, --commit, $INPUTS.main]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        path: {type: string}
        branch: {type: string}
        base: {type: string}
        hub: {type: string}
        hub_name: {type: string}
        check: {type: string}
        prompt:
          type: object
          properties:
            guard: {type: string}
            gate_step: {type: string}
            commit_shape: {type: string}
          required: [guard, gate_step, commit_shape]
        target: {type: object}
      required: [path, branch, base, hub, hub_name, check, prompt, target]

  - id: plan
    type: agent
    description: The ticket plan, tickets/<ticket>/plan.md (local drift applied).
    depends_on: [worktree]
    prompt_file: ticket-plan.md
    context: fresh
    with:
      feature: $INPUTS.feature
      ticket: $INPUTS.ticket
      brief: $INPUTS.brief
      checkout: $worktree.output.path
    output_format:
      type: object
      properties:
        path: {type: string, minLength: 1}
      required: [path]

  - id: rounds
    type: loop_group
    description: Implement, check, review - again until PASS, the session blocked or a discovery; three rounds at most.
    depends_on: [plan]
    max_iterations: 3
    until_when: "$verdict.output.status == 'blocked' || $verdict.output.discovery != '' || $review.output.verdict == 'PASS'"
    nodes:
      - id: implement
        type: agent
        description: The implementing session, resumed each round with the last round's feedback.
        prompt_file: ticket-implement.md
        cwd: $worktree.output.path
        retry: {max_attempts: 0}

      - id: verdict
        type: shell
        description: The session's reply read as hub run reads it - done, or blocked with a question - and its discovery.
        depends_on: [implement]
        command: [hub, step, verdict]
        # On stdin: a reply may be longer than one argument holds, or hold NUL.
        stdin: $implement.output
        retry: {max_attempts: 0}
        output_format:
          type: object
          properties:
            status: {type: string, enum: [done, blocked]}
            question: {type: string}
            discovery: {type: string}
          required: [status, question, discovery]

      - id: check
        type: script
        description: The repo's check on the round's work; a red check is data, not a failure.
        depends_on: [verdict]
        when: "$verdict.output.status != 'blocked' && $verdict.output.discovery == ''"
        runtime: python
        script: check.py
        args: [$worktree.output.check, $LOOP_PREV.check.output.round]
        cwd: $worktree.output.path
        retry: {max_attempts: 0}
        output_format:
          type: object
          properties:
            passed: {type: boolean}
            exit_code: {type: integer}
            round: {type: integer, minimum: 1}
            tail: {type: string}
          required: [passed, exit_code, round, tail]

      - id: spec
        type: agent
        description: The spec lens on the commits; it must leave the checkout's git status as it was.
        depends_on: [check]
        when: "$check.output.passed == true"
        context: fresh
        prompt_file: spec-lens.md
        cwd: $worktree.output.path
        mutates_checkout: false
        with:
          ticket: $INPUTS.ticket
          task: $INPUTS.ticket
          round: $check.output.round
          base: $worktree.output.base
          spec: $INPUTS.issue_text
        output_format:
          type: object
          additionalProperties: false
          required: [schema, reviewer, ticket, task, round, commit, verdict, findings]
          properties:
            schema: {type: string, const: agent-hub/review/1}
            reviewer: {type: string, enum: [spec, quality]}
            ticket: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,31}$"}
            task: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
            round: {type: integer, minimum: 1, maximum: 9999}
            commit: {type: string, pattern: "^[0-9a-f]{7,40}$"}
            verdict: {type: string, enum: [PASS, FAIL]}
            findings:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [id, kind, severity, path, line, acs, what, expected]
                properties:
                  id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"}
                  kind:
                    type: string
                    enum: [missing, extra, test, assertion, contract, invariant, security, idempotency, quality]
                  severity: {type: string, enum: [blocking, minor]}
                  path: {type: string, minLength: 1, maxLength: 512, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"}
                  line:
                    anyOf: [{type: integer, minimum: 1, maximum: 10000000}, {type: "null"}]
                  acs:
                    type: array
                    maxItems: 50
                    items: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
                  what: {type: string, minLength: 1, maxLength: 1000, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"}
                  expected: {type: string, minLength: 1, maxLength: 1000, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"}

      - id: quality
        type: agent
        description: The quality lens on the commits; it must leave the checkout's git status as it was.
        depends_on: [check]
        when: "$check.output.passed == true"
        context: fresh
        prompt_file: quality-lens.md
        cwd: $worktree.output.path
        mutates_checkout: false
        with:
          ticket: $INPUTS.ticket
          task: $INPUTS.ticket
          round: $check.output.round
          base: $worktree.output.base
          spec: $INPUTS.issue_text
        output_format:
          type: object
          additionalProperties: false
          required: [schema, reviewer, ticket, task, round, commit, verdict, findings]
          properties:
            schema: {type: string, const: agent-hub/review/1}
            reviewer: {type: string, enum: [spec, quality]}
            ticket: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,31}$"}
            task: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
            round: {type: integer, minimum: 1, maximum: 9999}
            commit: {type: string, pattern: "^[0-9a-f]{7,40}$"}
            verdict: {type: string, enum: [PASS, FAIL]}
            findings:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [id, kind, severity, path, line, acs, what, expected]
                properties:
                  id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"}
                  kind:
                    type: string
                    enum: [missing, extra, test, assertion, contract, invariant, security, idempotency, quality]
                  severity: {type: string, enum: [blocking, minor]}
                  path: {type: string, minLength: 1, maxLength: 512, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"}
                  line:
                    anyOf: [{type: integer, minimum: 1, maximum: 10000000}, {type: "null"}]
                  acs:
                    type: array
                    maxItems: 50
                    items: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
                  what: {type: string, minLength: 1, maxLength: 1000, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"}
                  expected: {type: string, minLength: 1, maxLength: 1000, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"}

      - id: review
        type: script
        description: The lenses' verdicts joined - PASS only when both pass.
        depends_on: [spec, quality]
        runtime: python
        script: verdict.py
        args: [--spec, $spec.output.verdict, --quality, $quality.output.verdict]
        output_format:
          type: object
          properties:
            verdict: {type: string, enum: [PASS, FAIL]}
            lenses:
              type: object
              properties:
                spec: {type: string, enum: [PASS, FAIL]}
                quality: {type: string, enum: [PASS, FAIL]}
              required: [spec, quality]
          required: [verdict, lenses]

      - id: notes
        type: script
        description: The check's result and the spec findings, for the next round (a lens not run reads empty).
        depends_on: [check, spec]
        trigger_rule: none_failed_min_one_success
        runtime: python
        script: feedback.py
        args: [--check, $check.output]
        stdin: $spec.output
        retry: {max_attempts: 0}
        output_format:
          type: object
          properties:
            check: {type: [object, "null"]}
            findings: {type: array}
            omitted: {type: integer, minimum: 0}
          required: [check, findings, omitted]

      - id: feedback
        type: script
        description: The notes and the quality findings, blocking first, within the 32 KiB budget.
        depends_on: [notes, quality]
        trigger_rule: none_failed_min_one_success
        runtime: python
        script: feedback.py
        args: [--notes, $notes.output]
        stdin: $quality.output
        retry: {max_attempts: 0}
        output_format:
          type: object
          properties:
            check: {type: [object, "null"]}
            findings: {type: array}
            omitted: {type: integer, minimum: 0}
          required: [check, findings, omitted]

  - id: outcome
    type: script
    description: How the pass ended - blocked, a discovery, or done with the review's verdict - its worktree and any superseded approval.
    depends_on: [rounds, check]
    trigger_rule: none_failed_min_one_success
    runtime: python
    script: pass_outcome.py
    args: [--rounds, $rounds.output, --worktree, $worktree.output, --superseded, $check.output.superseded]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        status: {type: string, enum: [done, blocked, discovery]}
        question: {type: string}
        verdict: {type: string}
        next_input: {type: string, enum: ["", discovery]}
        next_text: {type: string}
        superseded: {type: string}
        path: {type: string}
        base: {type: string}
        target: {type: [object, "null"]}
      required: [status, question, verdict, next_input, next_text, superseded, path, base, target]
