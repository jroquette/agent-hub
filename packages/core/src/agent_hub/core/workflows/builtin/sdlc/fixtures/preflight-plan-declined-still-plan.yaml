# The owner declines the dependent's plan change with a note; the re-check still finds plan drift:
# the decision is recorded and the check ends blocked, with no worktree, branch or PR (AC-3.2, as
# AC-2.12).
workflow: preflight
inputs:
  feature: demo-flow
  ticket: DEM-8
  blocker: DEM-7
stubs:
  due:
    output: {due: true, reason: '', input: none}
  context:
    output: {path: /ws/hub/brain/features/demo-flow/tickets/DEM-8/brief.md, hub: /ws/hub, repo: demo-api,
      commit: 0a1b2c3d4e}
  check__preflight:
    output:
      drift: plan
      local_notes: []
      blockers_read: [DEM-7]
      evidence: DEM-7's outcome returns a page, not the list T2's contract reads.
      proposal: T2 reads the page and keeps the list contract.
      affected: T3
      summary: T2 reads DEM-7's page
  check__request:
    output: {n: 1, plan_from: 1, plan_to: 2}
  check__record:
    output: {runs: 2}
  check__gate: {decision: decline, approver: Dana Owner, text: Keep the list contract.}
  check__declined:
    output: {decision: declined}
  check__recheck:
    output:
      drift: plan
      local_notes: []
      blockers_read: [DEM-7]
      evidence: The list contract cannot be kept over a page.
      proposal: T2 reads the page.
      affected: T3
      summary: T2 reads DEM-7's page
  check__rerecord:
    output: {runs: 3}
  check__result:
    output: {status: blocked, superseded: ''}
expect: {status: done, outcome: blocked}
reached: [due, context, check__preflight, check__request, check__record, check__gate, check__declined,
  check__recheck, check__rerecord, check__result]
