# Preflight finds plan drift: the change request opens, its run is recorded, and the run pauses at
# the owner's gate; no ticket plan, implement, review, eval or PR node runs (AC-2.6).
workflow: implement
inputs:
  feature: demo-flow
  issue: DEM-1
  repo: demo-api
  issue_text: "```text\nid: DEM-1\n```"
stubs:
  context:
    output: {path: brain/features/demo-flow/tickets/DEM-1/brief.md, version: 1}
  pending:
    output: {request: null, decision: '', input: none, note: '', summary: ''}
  worktree:
    output:
      path: /ws/demo-api/.claude/worktrees/dem-1
      branch: jdoe/dem-1
      base: origin/trunk
      hub: /ws/hub
      hub_name: hub
      check: make check
      prompt: {guard: has, gate_step: Run the fast gate., commit_shape: Conventional Commits}
      target: {path: /ws/demo-api/.claude/worktrees/dem-1, branch: jdoe/dem-1, base: origin/trunk}
  pass-1__preflight:
    output:
      plan_version: 1
      commit: 0a1b2c3d
      blockers_read: []
      drift: plan
      local_notes: []
      evidence: The handler moved to src/api/routes.py.
      proposal: Route T2 through routes.py.
      affected: T3
      summary: T2 goes through routes.py
  pass-1__request:
    output: {path: brain/features/demo-flow/change-requests/1.md, n: 1, plan_from: 1, plan_to: 2}
  pass-1__entry:
    output:
      ran_at: '2026-10-21T10:00:00+00:00'
      plan_version: 1
      commit: 0a1b2c3d
      blockers_read: []
      input: none
      input_text: null
      drift: plan
      local_notes: []
      change_request: 1
      run_id: implement-1
  pass-1__record:
    output: {path: brain/features/demo-flow/tickets/DEM-1/preflight.json, runs: 1}
expect: {status: paused}
reached: [context, pending, worktree, pass-1__preflight, pass-1__request, pass-1__entry, pass-1__record,
  pass-1__gate]
