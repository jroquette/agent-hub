# The quality lens fails every round: past three rounds the group fails (max_iterations), no PR
# opens and the run fails with no outcome.
workflow: deliver
inputs: {issue: DEM-1, repo: demo-api, issue_text: "```text\nid: DEM-1\n```"}
stubs:
  worktree:
    output:
      path: /ws/demo-api/.claude/worktrees/dem-1
      branch: jdoe/dem-1
      base: origin/trunk
      hub: /ws/hub
      hub_name: hub
      check: make check
      prompt: {guard: has, gate_step: Run the fast gate., commit_shape: Conventional Commits}
      target: {path: /ws/demo-api/.claude/worktrees/dem-1, branch: jdoe/dem-1, base: origin/trunk}
  rounds__implement: {text: Changes the code.}
  rounds__verdict: {output: {status: done, summary: Changes the code., question: ""}}
  rounds__check: [{output: {passed: true, exit_code: 0, round: 1, tail: "ok\n"}}, {output: {passed: true, exit_code: 0, round: 2, tail: "ok\n"}}, {output: {passed: true, exit_code: 0, round: 3, tail: "ok\n"}}]
