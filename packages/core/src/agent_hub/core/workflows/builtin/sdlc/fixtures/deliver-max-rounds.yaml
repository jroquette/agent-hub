  rounds__quality: [{output: {schema: agent-hub/review/1, reviewer: quality, ticket: DEM-1, task: DEM-1, round: 1, commit: 0a1b2c3d, verdict: FAIL, findings: [{id: F1, kind: missing, severity: blocking, path: src/api.py, line: 12, acs: [AC-1], what: The endpoint is not added., expected: The issue's endpoint exists.}]}}, {output: {schema: agent-hub/review/1, reviewer: quality, ticket: DEM-1, task: DEM-1, round: 2, commit: 0a1b2c3d, verdict: FAIL, findings: [{id: F1, kind: missing, severity: blocking, path: src/api.py, line: 12, acs: [AC-1], what: The endpoint is not added., expected: The issue's endpoint exists.}]}}, {output: {schema: agent-hub/review/1, reviewer: quality, ticket: DEM-1, task: DEM-1, round: 3, commit: 0a1b2c3d, verdict: FAIL, findings: [{id: F1, kind: missing, severity: blocking, path: src/api.py, line: 12, acs: [AC-1], what: The endpoint is not added., expected: The issue's endpoint exists.}]}}]
