# One dependency upgrade, from the package's changelog to a PR: the issue's worktree, the
# repo's fast gate read from the hub's hub.json (fast_gate.py, before any agent runs), the bump
# made with the repo's own tooling (bump.py: uv or npm, which regenerate the lockfiles; the script
# writes none and refuses a change outside the manifests and lockfiles), the upstream release
# notes (release_notes.py: a workflow agent cannot reach the network), a read-only agent that
# finds where each breaking change hits the repo, the fast check, and up to three rounds of an
# adapting agent and the check again. Then test strength on the files adapt changed
# (strength.py), the size approval for a risky bump (major, no changelog, or more than five
# files touched), the full check, the commits, the outcome (outcome.py: done or blocked, and
# the PR summary), the publish approval and the PR.
# Invariants: lockfiles are regenerated by tooling only (an adapt edit to one blocks the run);
# one package per run, so one risky bump per PR; no tracker read or write (ADR 0030: only
# hub step worktree, commits, pr and report); every push waits on the publish approval. The
# /upgrade skill starts it (./hub workflow run upgrade ... --live); a scheduled or event start
# is hub.json config, not this pack's.
version: 1
name: upgrade
description: One package bumped with the repo's tooling, its changelog read, the code adapted, checked and opened as a PR.
revision: 1
inputs:
  issue:
    required: true
    description: The tracker issue, <team>-<n>; it names the worktree and the branch.
  repo:
    required: true
    description: The repo to change, its dir in hub.json.
  package:
    required: true
    description: The package to bump, its uv or npm name.
  to:
    required: true
    description: The version to bump to, a final release (1.2.3).
returns: report
outcome_field: delivery
nodes:
  - id: worktree
    type: shell
    description: Make (or keep) the issue's worktree from a fresh fetch; print the repo's target.
    command: [hub, step, worktree, --issue, $INPUTS.issue, --repo, $INPUTS.repo]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        path: {type: string}
        branch: {type: string}
        base: {type: string}
        hub: {type: string}
        hub_name: {type: string}
        check: {type: string}
        prompt:
          type: object
          properties:
            guard: {type: string}
            gate_step: {type: string}
            commit_shape: {type: string}
          required: [guard, gate_step, commit_shape]
        target: {type: object}
      required: [path, branch, base, hub, hub_name, check, prompt, target]

  - id: gate
    type: script
    description: The repo's check_fast from the hub's hub.json; none, and the full check runs (said why).
    depends_on: [worktree]
    runtime: python
    script: fast_gate.py
    # The file is named here, not in the script: the hub's hooks read hub.json only through
    # their reader, and this script is not a hook.
    args: [--config, hub.json, --repo, $INPUTS.repo, --full, $worktree.output.check]
    timeout: 5m
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        check_fast: {type: string, minLength: 1}
        source: {type: string, enum: [check_fast, check]}
        reason: {type: string}
      required: [check_fast, source, reason]

  - id: bump
    type: script
    description: Bump the package with uv or npm and commit the manifests and lockfiles they changed.
    depends_on: [gate]
    runtime: python
    script: bump.py
    args: [--package, $INPUTS.package, --to, $INPUTS.to, --issue, $INPUTS.issue]
    cwd: $worktree.output.path
    timeout: 15m
    retry: {max_attempts: 0}
    output_format:
      type: object
      additionalProperties: false
      properties:
        manager: {type: string, enum: [uv, npm]}
        dir: {type: string}
        from: {type: string}
        to: {type: string}
        major: {type: boolean}
        files: {type: array, maxItems: 100, items: {type: string}}
        commit: {type: string, pattern: "^[0-9a-f]{40}$"}
      required: [manager, dir, from, to, major, files, commit]

  - id: notes
    type: script
    description: The upstream release notes between the two versions; none found is data, not a failure.
    depends_on: [bump]
    runtime: python
    script: release_notes.py
    args:
      - --manager
      - $bump.output.manager
      - --package
      - $INPUTS.package
      - --from
      - $bump.output.from
      - --to
      - $bump.output.to
    mutates_checkout: false
    timeout: 3m
    retry: {max_attempts: 0}
    output_format:
      type: object
      additionalProperties: false
      properties:
        found: {type: boolean}
        sources: {type: array, maxItems: 10, items: {type: string, maxLength: 500}}
        text: {type: string}
        truncated: {type: boolean}
        reason: {type: string, maxLength: 500}
      required: [found, sources, text, truncated, reason]

  - id: changelog
    type: agent
    description: Read the notes and list each breaking change that hits the repo, with path:line.
    depends_on: [notes]
    prompt_file: changelog.md
    cwd: $worktree.output.path
    mutates_checkout: false
    timeout: 20m
    retry: {max_attempts: 0}
    with:
      package: $INPUTS.package
      from: $bump.output.from
      to: $bump.output.to
      sources: $notes.output.sources
      found: $notes.output.found
      reason: $notes.output.reason
      notes: $notes.output.text
    output_format:
      type: object
      additionalProperties: false
      required: [breaking, summary]
      properties:
        breaking:
          type: array
          maxItems: 30
          # No backtick: the items reach the adapt prompt inside a fence.
          items:
            type: object
            additionalProperties: false
            required: [change, path, line, action]
            properties:
              change: {type: string, minLength: 1, maxLength: 200, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f`]*$"}
              path: {type: string, minLength: 1, maxLength: 256, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f`]*$"}
              line:
                anyOf: [{type: integer, minimum: 1, maximum: 10000000}, {type: "null"}]
              action: {type: string, minLength: 1, maxLength: 200, pattern: "^[^\\x00-\\x1f\\x7f-\\x9f`]*$"}
        summary: {type: string, maxLength: 2000}

  - id: check
    type: script
    description: The repo's fast check on the bump; a red check is data, not a failure.
    depends_on: [changelog]
    runtime: python
    script: check.py
    args: [$gate.output.check_fast]
    cwd: $worktree.output.path
    timeout: 30m
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        passed: {type: boolean}
        exit_code: {type: integer}
        round: {type: integer, minimum: 1}
        tail: {type: string}
      required: [passed, exit_code, round, tail]

  - id: adapt
    type: loop_group
    description: Adapt the code to the bump and check again, three rounds at most.
    depends_on: [check]
    when: "$check.output.passed == false"
    max_iterations: 3
    # The blocked clause first: a skipped recheck is never compared with a number. Round 3 ends
    # the group completed, and outcome.py turns a red one into blocked (never a failed run).
    until_when: "$fix.output.status == 'blocked' || $recheck.output.passed == true || $recheck.output.round >= 3"
    nodes:
      - id: fix
        type: agent
        description: The adapting session, resumed each round with the last check's tail.
        prompt_file: adapt.md
        cwd: $worktree.output.path
        timeout: 45m
        retry: {max_attempts: 0}
        with:
          package: $INPUTS.package
          from: $bump.output.from
          to: $bump.output.to
          breaking: $changelog.output.breaking
          check_fast: $gate.output.check_fast
          commit_shape: $worktree.output.prompt.commit_shape
          first_tail: $check.output.tail
          last_tail: $LOOP_PREV.recheck.output.tail
        output_format:
          type: object
          additionalProperties: false
          required: [status, summary, question]
          properties:
            status: {type: string, enum: [done, blocked]}
            summary: {type: string, maxLength: 2000}
            question: {type: string, maxLength: 1000}

      - id: recheck
        type: script
        description: The fast check on the round's work.
        depends_on: [fix]
        when: "$fix.output.status != 'blocked'"
        runtime: python
        script: check.py
        args: [$gate.output.check_fast, $LOOP_PREV.recheck.output.round]
        cwd: $worktree.output.path
        timeout: 30m
        retry: {max_attempts: 0}
        output_format:
          type: object
          properties:
            passed: {type: boolean}
            exit_code: {type: integer}
            round: {type: integer, minimum: 1}
            tail: {type: string}
          required: [passed, exit_code, round, tail]

  - id: strength
    type: script
    description: The files touched since the bump, a lockfile edit, and test strength on adapt's lines.
    depends_on: [check, adapt]
    trigger_rule: none_failed_min_one_success
    when: "$check.output.passed == true || $adapt.output.recheck.passed == true"
    runtime: python
    script: strength.py
    args: [--base, $bump.output.commit, --budget, "600"]
    cwd: $worktree.output.path
    timeout: 20m
    retry: {max_attempts: 0}
    output_format:
      type: object
      additionalProperties: false
      properties:
        touched: {type: integer, minimum: 0}
        files: {type: array, maxItems: 200, items: {type: string}}
        lockfiles_edited: {type: array, maxItems: 50, items: {type: string}}
        lockfile_edit: {type: boolean}
        ran: {type: boolean}
        tool: {type: string}
        reason: {type: string}
        mutants: {type: integer, minimum: 0}
        killed: {type: integer, minimum: 0}
        inconclusive: {type: integer, minimum: 0}
        survived:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            properties:
              path: {type: string}
              line: {type: integer}
              mutator: {type: string}
              replacement: {type: string}
            required: [path, line, mutator, replacement]
        more_survived: {type: integer, minimum: 0}
      required: [touched, files, lockfiles_edited, lockfile_edit, ran, tool, reason, mutants, killed, inconclusive, survived, more_survived]

  - id: size
    type: approval
    description: A risky bump (major, no changelog, or more than five files touched) asks before the full check.
    depends_on: [strength]
    when: "$bump.output.major == true || $notes.output.found == false || $strength.output.touched > 5"
    message: >-
      $INPUTS.package $bump.output.from -> $bump.output.to is a risky bump (major: $bump.output.major,
      changelog found: $notes.output.found, files touched: $strength.output.touched). Approve to run
      the full check and go on to the PR; reject to stop here and split it (the branch keeps its
      commits).

  - id: check-full
    type: script
    description: The repo's full check, once the fast one is green.
    depends_on: [strength, size]
    trigger_rule: none_failed_min_one_success
    # An adapt edit to a manifest or lockfile blocks the run (outcome.py): no full check first.
    when: "$strength.output.lockfile_edit == false"
    runtime: python
    script: check.py
    args: [$worktree.output.check]
    cwd: $worktree.output.path
    timeout: 2h
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        passed: {type: boolean}
        exit_code: {type: integer}
        round: {type: integer, minimum: 1}
        tail: {type: string}
      required: [passed, exit_code, round, tail]

  - id: commits
    type: shell
    description: The commits on the branch, and whether a tracked change sits beside them.
    depends_on: [check-full]
    when: "$check-full.output.passed == true"
    command: [hub, step, commits, --target, $worktree.output.target]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        count: {type: integer, minimum: 0}
        subjects: {type: array, items: {type: string}}
        summary: {type: string}
        dirty: {type: boolean}
      required: [count, subjects, summary, dirty]

  - id: outcome
    type: script
    description: Done or blocked (and why, the failing check named), and the PR's summary.
    depends_on: [check, adapt, strength, check-full, commits]
    trigger_rule: none_failed_min_one_success
    runtime: python
    script: outcome.py
    args:
      - --fast-gate
      - $gate.output.check_fast
      - --full-gate
      - $worktree.output.check
      - --package
      - $INPUTS.package
      - --bump
      - $bump.output
      - --notes-found
      - $notes.output.found
      - --notes-reason
      - $notes.output.reason
      - --sources
      - $notes.output.sources
      - --changelog
      - $changelog.output
      - --check
      - $check.output
      - --adapt
      - $adapt.output
      - --strength
      - $strength.output
      - --full
      - $check-full.output
    timeout: 5m
    retry: {max_attempts: 0}
    output_format:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [done, blocked]}
        question: {type: string}
        summary: {type: string, maxLength: 8000}
      required: [status, question, summary]

  - id: publish
    type: approval
    description: Every push waits on a person; a reject stops the run with the branch kept.
    depends_on: [outcome, commits]
    when: "$outcome.output.status == 'done' && $commits.output.count > 0 && $commits.output.dirty == false"
    message: >-
      Push the branch of $INPUTS.issue and open its PR? Approve to push; reject to stop with the
      branch kept. The PR's summary: $outcome.output.summary

  - id: pr
    type: shell
    description: Push the branch and open its PR, or find the one open.
    depends_on: [publish]
    command: [hub, step, pr, --issue, $INPUTS.issue, --target, $worktree.output.target, --summary, $outcome.output.summary]
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        url: {type: string}
        found: {type: boolean}
        summary: {type: string}
        title_unmatched: {type: [string, "null"]}
      required: [url, found, summary, title_unmatched]

  - id: report
    type: shell
    description: The run's delivery, from what the steps printed (no tracker write).
    depends_on: [outcome, commits, pr]
    trigger_rule: none_failed_min_one_success
    command:
      - hub
      - step
      - report
      - --status
      - $outcome.output.status
      - --question
      - $outcome.output.question
      - --commits
      - $commits.output.count
      - --dirty
      - $commits.output.dirty
      - --pr
      - $pr.output.url
      - --summary
      - $pr.output.summary
    retry: {max_attempts: 0}
    output_format:
      type: object
      properties:
        delivery: {type: string, enum: [delivered, no_changes, blocked, failed]}
        stage: {type: string}
        reason: {type: string}
        question: {type: string}
        pr: {type: string}
        summary: {type: string}
      required: [delivery, stage, reason, question, pr, summary]
