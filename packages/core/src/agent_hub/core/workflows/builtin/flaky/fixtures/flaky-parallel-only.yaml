# AC-2: the test fails only when its folder runs under pytest-xdist -n auto: classify and report
# run, and the run ends done, reproduced.
workflow: flaky
inputs: {repo: demo-api, test: "tests/test_x.py::test_y", runs: 20}
stubs:
  config:
    output: {default_branch: main, branch_prefix: jdoe/, author_name: null, author_email: null, ready_label: agent-ready, teams: [DEM], hub: {github: acme/demo-hub, default_branch: main, target: {github: acme/demo-hub, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}, repos: [{dir: demo-api, github: acme/demo-api, default_branch: main, check_fast: make check-fast, check: make check, target: {github: acme/demo-api, default_branch: main, conventions: {branch: "", commit_title: "", pr_title: "", titles_configured: false, pr_title_explicit: false}}}]}
  repeat:
    output:
      test: "tests/test_x.py::test_y"
      repo: demo-api
      repo_path: /ws/demo-api
      sha: 0a1b2c3d4e5f60718293a4b5c6d7e8f901234567
      runner: [uv, run, --locked, python]
      runs: 20
      budget_spent: false
      reproduced: true
      modes:
        - {mode: alone, status: ran, note: "the test alone", passed: 20, failed: 0, errors: 0, timed_out: 0, missing: 0, not_run: 0, tails: []}
        - {mode: suite, status: ran, note: "tests/test_x.py in its default order", passed: 20, failed: 0, errors: 0, timed_out: 0, missing: 0, not_run: 0, tails: []}
        - {mode: shuffled, status: unavailable, note: "skipped: neither pytest-randomly nor pytest-random-order is installed", passed: 0, failed: 0, errors: 0, timed_out: 0, missing: 0, not_run: 0, tails: []}
        - {mode: parallel, status: ran, note: "the folder tests under pytest-xdist -n auto", passed: 17, failed: 3, errors: 0, timed_out: 0, missing: 0, not_run: 0, tails: ["run 4: E   TimeoutError: the server did not start in 2 s"]}
  classify:
    output: {cause: timing, shared: none, confidence: medium, evidence: "Fails 3 of 20 only under parallel; the test waits 2 s for a server.", next_step: ""}
  report: {output: {outcome: reproduced, path: "brain/_inbox/flaky-<slug>.md"}}
expect: {status: done, outcome: reproduced}
reached: [config, repeat, classify, report]
