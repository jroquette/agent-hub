[project]
name = "agent-hub-core"
version = "0.1.0"
description = "Domain, canonical event, schemas and ports of agent-hub."
requires-python = ">=3.14"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent_hub is an implicit namespace package shared by every distribution.
packages = ["src/agent_hub"]
