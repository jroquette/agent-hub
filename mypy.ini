[mypy]
strict = True
namespace_packages = True
explicit_package_bases = True
# Each package's src/ is a base for the implicit namespace package agent_hub. Tests are not
# type-checked: their basenames repeat across packages and they have no __init__.py.
mypy_path = packages/core/src:packages/storage/src:packages/collector/src:packages/generator/src:packages/tracker_linear/src:packages/hub_git/src:packages/claude_sessions/src:packages/cli/src:packages/api/src:packages/mcp_server/src
files = packages/core/src,packages/storage/src,packages/collector/src,packages/generator/src,packages/tracker_linear/src,packages/hub_git/src,packages/claude_sessions/src,packages/cli/src,packages/api/src,packages/mcp_server/src,scripts,conftest.py
# A hyphenated pack's folder is no package name, so its scripts map to bare module names, and
# packs repeat them (report.py): `make typecheck` checks each such folder in its own run.
exclude = (?x)^packages/core/src/agent_hub/core/workflows/builtin/[a-z0-9]+(-[a-z0-9]+)+/scripts/
