# A release is an annotated tag vX.Y.Z on a commit of main (ADR 0013). The tag is made in one of two ways:
# - workflow_dispatch (ADR 0047, the /release skill's way): release-tag checks the inputs, that the commit is on
#   main and declares the version (scripts/check_release.py), and that the tag is new, then creates the annotated
#   tag with the notes as its message and pushes that one tag. A tag pushed with GITHUB_TOKEN starts no other
#   workflow, so release-check runs after it in this same run.
# - a v* tag pushed by hand: release-check runs on it alone.
# release-check checks the tag: its form, that it is annotated and the cli and meta versions
# (scripts/check_release.py), that its commit is on main, and that the pinned uvx command prints that version.
# It creates, moves and publishes nothing. No full gate here: main already passed `make check`.
# A tag is never moved or deleted: release-tag refuses one that exists, and a wrong tag is fixed by a new patch release.
# Inputs and the tag go through env, never ${{ }} inside run: (script injection).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version X.Y.Z; the tag is vX.Y.Z"
        required: true
        type: string
      sha:
        description: "The full 40-character SHA of the commit on main to tag"
        required: true
        type: string
      notes:
        description: "The release notes, kept verbatim as the tag message"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes: it pushes the one tag.
    permissions:
      contents: write
    steps:
      # fetch-depth 0 fetches every branch and tag, so origin/main and the commit to tag exist.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same pin as ci.yml.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
      # The checks come first, so nothing is tagged on a bad input, and later lines only print validated
      # values. The versions are read from the commit to tag (git archive), not from this checkout. The
      # tagger is github-actions[bot]: the workflow makes the tag, not the owner; commits stay the owner's.
      # The token reaches git only through the GIT_CONFIG_* rewrite (never in the URL, never printed).
      # tests/e2e/test_release_dispatch_tag.py runs this run: block by the step name; rename both together.
      - name: Check the inputs, then create and push the annotated tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          NOTES: ${{ inputs.notes }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          export LC_ALL=C
          fail() { echo "release tag: $*" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must be X.Y.Z with ASCII digits"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "sha must be a full 40-character commit SHA in lowercase hex"
          [ -n "$NOTES" ] || fail "the notes are empty; they become the tag message"
          tag="v$VERSION"
          git rev-parse --verify -q origin/main > /dev/null || fail "origin/main is missing from the checkout"
          git cat-file -e "$SHA^{commit}" 2> /dev/null || fail "commit $SHA not found in the checkout"
          git merge-base --is-ancestor "$SHA" origin/main || fail "commit $SHA is not on main"
          at_sha="$(mktemp -d)"
          notes_file="$(mktemp)"
          trap 'rm -rf "$at_sha" "$notes_file"' EXIT
          git archive "$SHA" | tar -x -C "$at_sha"
          uv run --no-project --python 3.14 python scripts/check_release.py --root="$at_sha" --tag="$tag"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")" \
            || fail "git ls-remote failed (see git's error above)"
          [ -z "$existing" ] || fail "tag $tag already exists on the remote; a tag is never moved: cut the next patch release"
          printf '%s\n' "$NOTES" > "$notes_file"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" --cleanup=verbatim -F "$notes_file" "$SHA"
          git push origin "refs/tags/$tag"
          echo "release tag: $tag created on $SHA and pushed"

  # On a dispatch it runs after release-tag pushed the tag; on a pushed tag, alone.
  release-check:
    needs: release-tag
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-tag.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # fetch-depth 0 fetches every branch and tag, so origin/main exists for the ancestry check.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same pin as ci.yml.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
      # First, so the later steps only ever print a validated vX.Y.Z. Annotated or not is asked of
      # the remote: checkout may fetch an annotated tag as lightweight. Only an annotated tag has a
      # peeled ^{} entry; ls-remote prints nothing for a lightweight one. The token reaches git only
      # through the GIT_CONFIG_* rewrite (never in the URL, never printed).
      # tests/e2e/test_release_annotated_tag.py runs this run: block by the step name; rename both together.
      - name: Check the tag form, that it is annotated, and the cli and meta versions
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          peeled="$(git ls-remote --tags origin "refs/tags/$TAG^{}")" \
            || { echo "release check: git ls-remote failed (see git's error above)" >&2; exit 1; }
          uv run --no-project --python 3.14 python scripts/check_release.py --tag="$TAG" --peeled="$peeled"
      # ^{commit} handles annotated and lightweight tags (checkout may fetch the tag as lightweight).
      - name: Check the tag is on main
        run: |
          git rev-parse --verify -q origin/main > /dev/null || { echo "tag $TAG: origin/main is missing from the checkout" >&2; exit 1; }
          commit="$(git rev-parse --verify -q "refs/tags/$TAG^{commit}")" || { echo "tag $TAG: not found in the checkout" >&2; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main || { echo "tag $TAG: its commit is not on main" >&2; exit 1; }
          echo "tag $TAG: its commit is on main"
      # Run outside the checkout, as a user would. The token reaches git as in the first check;
      # uv fetches with system git.
      - name: Check the pinned uvx command prints the version
        working-directory: ${{ runner.temp }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          printed="$(uvx --from git+https://github.com/jroquette/agent-hub@"$TAG"#subdirectory=packages/agent-hub hub --version)" \
            || { echo "tag $TAG: the pinned uvx command failed (see uv's error above)" >&2; exit 1; }
          if [ "$printed" != "${TAG#v}" ]; then
            echo "tag $TAG: the pinned uvx command printed ${printed@Q}, expected ${TAG#v}" >&2
            exit 1
          fi
          echo "tag $TAG: the pinned uvx command printed $printed"
